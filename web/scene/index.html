<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <title>Crusher Scene</title>
    <style>
      html,
      body,
      #stage {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #171816;
        touch-action: none;
        overscroll-behavior: none;
      }

      body {
        -webkit-user-select: none;
        user-select: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        color: #c9d5df;
        font: 600 14px system-ui, sans-serif;
      }
    </style>
    <script defer src="scene.bundle.js"></script>
    <script defer src="stage_resize.js"></script>
  </head>
  <body>
    <main id="stage"><p id="fallback">3D sahne yükleniyor…</p></main>
  </body>
</html>
